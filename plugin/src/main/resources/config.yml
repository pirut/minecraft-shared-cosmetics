# Base URL of the shared cosmetics API.
api-url: "http://localhost:8080"
# This server's key, issued once by POST /v1/servers on the API.
server-key: ""
# How high above the player's mount point the hat is drawn, in blocks.
hat-offset-y: -0.25
# How often trails emit particles, in ticks.
trail-interval-ticks: 2
# The shared resource pack holds the custom hat models. Players' clients download it straight
# from the API (or the CDN the API points at), not from this server.
resource-pack:
  # Send it on join. It is added alongside any pack this server already sends (server.properties
  # or another plugin) rather than replacing it. Turn this off only if you merged the shared
  # assets into your own pack; see the README.
  enabled: true
  # Disconnect players who decline it. Off by default: without the pack, hats show as their plain item.
  required: false
  # Shown on the download prompt, in MiniMessage format.
  prompt: "<gold>Shared Cosmetics</gold> adds custom hat models."
