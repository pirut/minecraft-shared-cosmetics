name: SharedCosmetics
version: '${version}'
main: dev.sharedcosmetics.SharedCosmeticsPlugin
api-version: '1.21'
description: Cosmetics that follow players across every participating server.
commands:
  cosmetics:
    description: List, equip and unequip your shared cosmetics.
    usage: /cosmetics [list|equip <id>|unequip <slot>]
    permission: sharedcosmetics.use
permissions:
  sharedcosmetics.use:
    default: true
