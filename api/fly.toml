# Fly.io config for the central API. See "Hosting on Fly.io" in the repo README.
# Set your own app name with `fly launch --no-deploy --copy-config` or edit `app` below.
app = "shared-cosmetics-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Fly's proxy sets X-Forwarded-For; trust it so per-IP rate limits see the real client.
  TRUST_PROXY = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
